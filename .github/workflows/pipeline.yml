name: EIA pipeline

on:
  schedule:
    - cron: "0 13 5 * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      GCP_PROJECT: eia-energy-pipeline
      BQ_DATASET: eia_raw
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/614666427438/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: eia-pipeline@eia-energy-pipeline.iam.gserviceaccount.com

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest last 12 months
        run: python src/ingest_eia.py --states CO TX --start "$(date -u -d '12 months ago' +%Y-%m)"

      - name: Build and test dbt models
        working-directory: dbt
        run: |
          dbt deps
          dbt build

      - name: Export mart to CSV
        run: python src/export_mart.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/mart_price_yoy.csv
          git diff --cached --quiet || git commit -m "Refresh dashboard CSV"
          git push
